<!doctype html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<title>Familiada kół naukowych</title>
		<style>
			@keyframes slideIn {
				from {
					width: 0;
					opacity: 0;
				}
				to {
					width: 100%;
					opacity: 1;
				}
			}

			.reveal-animation {
				display: inline-block;
				animation: slideIn 0.6s ease-out;
				overflow: hidden;
				white-space: nowrap;
			}
		</style>
	</head>
	<body>
		<div id="upper_points">
			<div class="points" id="blue_team">
				<p>0</p>
			</div>
			<div class="points" id="avaible_point">
				<p>100</p>
			</div>
			<div class="points" id="red_team">
				<p>0</p>
			</div>
		</div>
		<div id="lower_part">
			<div class="mistakes" id="left_mistakes">
				<img src="X — kopia_bez_tla.png" alt="RED_X" />
				<img src="X — kopia_bez_tla.png" alt="RED_X" />
				<img src="X — kopia_bez_tla.png" alt="RED_X" />
			</div>
			<div id="main_question">
				<h3>Dokąd nocą tupta jeż?</h3>
				<ol>
					<li>
						<span id="a1">............................</span>
						<span id="p1"></span>
					</li>
					<li>
						<span id="a2">............................</span>
						<span id="p2"></span>
					</li>
					<li>
						<span id="a3">............................</span>
						<span id="p3"></span>
					</li>
					<li>
						<span id="a4">............................</span>
						<span id="p4"></span>
					</li>
					<li>
						<span id="a5">............................</span>
						<span id="p5"></span>
					</li>
				</ol>
				<p>Suma <span id="suma">0</span></p>
			</div>
			<div class="mistakes" id="right_mistakes">
				<img src="X — kopia_bez_tla.png" alt="RED_X" />
				<img src="X — kopia_bez_tla.png" alt="RED_X" />
				<img src="X — kopia_bez_tla.png" alt="RED_X" />
			</div>
		</div>
		<img
			id="bigX"
			src="X — kopia_bez_tla.png"
			style="
				display: none;
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 600px;
				z-index: 1000;
			"
		/>
		<audio id="wastedSound">
			<source src="wasted_GTA_sound.mp4" type="audio/mpeg" />
		</audio>

		<script>
			let allQuestions = [];
let currentQuestionIndex = 0;
let answers = [];
let currentTeam = "blue"; 
let originalTeam = "blue"; // Drużyna, która zaczęła rundę
let revealedAnswers = new Set();
let isTeamBTurn = false; // Czy jesteśmy w fazie przejęcia (szansa dla przeciwników)

const questionsData = {
    "questions": [
        {
            "id": 1,
            "title": "Dokąd nocą tupta jeż?",
            "answers": [
                { "text": "Peter Parking", "points": 43 },
                { "text": "Juan Pablo II", "points": 32 },
                { "text": "W rozpadlinę", "points": 10 },
                { "text": "Na polowanie", "points": 8 },
                { "text": "W zabury", "points": 7 }
            ]
        },
        {
            "id": 2,
            "title": "Co robi panda w ciągu dnia?",
            "answers": [
                { "text": "Zjada bambus", "points": 48 },
                { "text": "Śpi", "points": 28 },
                { "text": "Bawi się", "points": 15 },
                { "text": "Wspina się na drzewo", "points": 6 },
                { "text": "Walczy z innymi", "points": 3 }
            ]
        }
        // Dodaj resztę pytań tutaj...
    ]
};

function loadQuestions() {
    allQuestions = questionsData.questions;
    loadQuestion(0);
}

function loadQuestion(index) {
    if (index >= allQuestions.length) index = 0;
    currentQuestionIndex = index;
    const question = allQuestions[index];

    document.getElementById("main_question").querySelector("h3").innerText = question.title;
    document.getElementById("main_question").querySelector("h3").style.visibility = "hidden";
    
    answers = question.answers;
    revealedAnswers.clear();
    isTeamBTurn = false;
    mistakes = 0;
    soundPlayed = false;
    roundEnded = false;
    roundFinalized = false;

    for (let i = 1; i <= 5; i++) {
        document.getElementById("a" + i).innerText = "............................";
        document.getElementById("p" + i).innerText = "";
    }
    document.getElementById("suma").innerText = "0";
    
    // Resetuj Iksy na ekranie
    document.querySelectorAll(".mistakes img").forEach(img => img.style.opacity = "0");
    
    // Resetuj obramowanie i efekty świetlne do stanu początkowego
    document.getElementById("blue_team").style.boxShadow = "none";
    document.getElementById("red_team").style.boxShadow = "none";
    document.getElementById("blue_team").style.border = "3px solid rgba(30, 144, 255, 0.5)";
    document.getElementById("red_team").style.border = "3px solid rgba(255, 0, 0, 0.5)";
    document.getElementById("blue_team").style.borderWidth = "3px";
    document.getElementById("red_team").style.borderWidth = "3px";
    
    updateAvailablePoints();
}

function updateAvailablePoints() {
    let totalPoints = answers.reduce((sum, ans) => sum + ans.points, 0);
    document.getElementById("avaible_point").querySelector("p").innerText = totalPoints;
}

function setTeam(team) {
    if (isTeamBTurn) return; // Nie zmieniaj drużyny strzałkami podczas przejęcia!
    
    document.getElementById("blue_team").style.boxShadow = "none";
    document.getElementById("red_team").style.boxShadow = "none";
    
    // Reset both teams to thin border with light color
    document.getElementById("blue_team").style.border = "3px solid rgba(30, 144, 255, 0.3)";
    document.getElementById("red_team").style.border = "3px solid rgba(255, 0, 0, 0.3)";
    document.getElementById("blue_team").style.borderWidth = "3px";
    document.getElementById("red_team").style.borderWidth = "3px";

    if (team === "blue") {
        document.getElementById("blue_team").style.boxShadow = "0 0 25px #1e90ff";
        document.getElementById("blue_team").style.border = "3px solid #1e90ff";
        document.getElementById("blue_team").style.borderWidth = "7.5px";
    } else {
        document.getElementById("red_team").style.boxShadow = "0 0 25px red";
        document.getElementById("red_team").style.border = "3px solid red";
        document.getElementById("red_team").style.borderWidth = "7.5px";
    }
    currentTeam = team;
    originalTeam = team; // Zapamiętujemy, kto zaczął grać to pytanie
}

function reveal(n) {
    if (!answers[n - 1] || revealedAnswers.has(n)) return;

    // Przy pierwszej poprawnej odpowiedzi pokazujemy pytanie
    document.getElementById("main_question").querySelector("h3").style.visibility = "visible";

    const answerElement = document.getElementById("a" + n);
    answerElement.innerHTML = `<span class="reveal-animation">${answers[n - 1].text}</span>`;
    document.getElementById("p" + n).innerText = answers[n - 1].points;
    revealedAnswers.add(n);

    // Only update suma if round is not finalized
    if (!roundFinalized) {
        let suma = 0;
        for (let i = 1; i <= 5; i++) {
            let p = document.getElementById("p" + i).innerText;
            if (p !== "") suma += parseInt(p);
        }
        document.getElementById("suma").innerText = suma;
    }
    
    // Sprawdź czy wszystkie 5 odpowiedzi zostały odkryte
    // Check if all 5 answers revealed - require Enter to finish
    if (revealedAnswers.size === 5 && !isTeamBTurn && !roundFinalized) {
        console.log("Wszystkie odpowiedzi odkryte! Naciśnij Enter by przejść do następnego pytania.");
    }
}

function endRound(winner) {
    let suma = parseInt(document.getElementById("suma").innerText);
    let scoreElement = document.querySelector(`#${winner}_team p`);
    scoreElement.innerText = parseInt(scoreElement.innerText) + suma;
    console.log("Naciśnij Enter by przejść do następnego pytania.");
    roundFinalized = true;
}

let mistakes = 0;
let soundPlayed = false;
let roundEnded = false;
let roundFinalized = false;

document.addEventListener("keydown", function (e) {
    // 0. Przejście do następnego pytania (Enter)
    if (e.key === "Enter") {
        if (roundEnded) {
            roundEnded = false;
            roundFinalized = false;
            loadQuestion(currentQuestionIndex + 1);
        } else if (revealedAnswers.size === 5 && !isTeamBTurn && !roundFinalized) {
            // All 5 answers revealed - award points to original team
            endRound(originalTeam);
            roundEnded = false;
            loadQuestion(currentQuestionIndex + 1);
        }
        return;
    }
    
    // 1. Wybór drużyny (tylko przed przejęciem)
    if (e.key === "ArrowLeft") setTeam("blue");
    if (e.key === "ArrowRight") setTeam("red");

    // 2. Odsłanianie odpowiedzi
    if (e.key >= "1" && e.key <= "5") {
        let n = parseInt(e.key);
        
        if (!isTeamBTurn) {
            reveal(n);
        } else if (!roundFinalized) {
            // Logika przejęcia: Drużyna B trafia -> wygrywa całość
            reveal(n);
            endRound(currentTeam);
            roundEnded = true;
        } else {
            // Round already finalized, still allow reveal but no endRound
            reveal(n);
        }
    }

    // 3. Błędy (Spacja)
    if (e.code === "Space") {
        e.preventDefault();
        
        if (!isTeamBTurn) {
            // Drużyna A się myli
            mistakes++;
            let side = originalTeam === "blue" ? "left" : "right";
            let xs = document.querySelectorAll(`#${side}_mistakes img`);
            if (mistakes <= 3) xs[mistakes - 1].style.opacity = "1";

            if (mistakes === 3) {
                playWasted();
                isTeamBTurn = true;
                // Automatycznie przełączamy podświetlenie na przeciwników
                currentTeam = (originalTeam === "blue" ? "red" : "blue");
                document.getElementById("blue_team").style.boxShadow = currentTeam === "blue" ? "0 0 25px #1e90ff" : "none";
                document.getElementById("red_team").style.boxShadow = currentTeam === "red" ? "0 0 25px red" : "none";
                document.getElementById("blue_team").style.borderWidth = currentTeam === "blue" ? "7.5px" : "3px";
                document.getElementById("red_team").style.borderWidth = currentTeam === "red" ? "7.5px" : "3px";
                document.getElementById("blue_team").style.borderColor = currentTeam === "blue" ? "#1e90ff" : "rgba(30, 144, 255, 0.3)";
                document.getElementById("red_team").style.borderColor = currentTeam === "red" ? "red" : "rgba(255, 0, 0, 0.3)";
            }
        } else {
            // Drużyna B się myli podczas przejęcia -> Oryginalna drużyna zgarnia punkty
            playWasted();
            endRound(originalTeam);
            roundEnded = true;
        }
    }
});

function playWasted() {
    let bigX = document.getElementById("bigX");
    bigX.style.display = "block";
    let audio = document.getElementById("wastedSound");
    audio.currentTime = 0;
    audio.play();
    setTimeout(() => { bigX.style.display = "none"; }, 3000);
}

loadQuestions();
		</script>
	</body>
</html>
